<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Blue gradient for left hand -->
    <linearGradient id="blueHandGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#004c99" />
      <stop offset="60%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#008ae6" />
    </linearGradient>

    <!-- Orange gradient for right hand -->
    <linearGradient id="orangeHandGrad" x1="20%" y1="100%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#e65100" />
      <stop offset="50%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Subtle inner shadow/glow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>

    <!-- Circular clip path for rounded format -->
    <clipPath id="roundedCircleClip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>
  </defs>

  <!-- Circular background badge to ensure "Formato Arredondado" -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" stroke="#e0f2fe" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 3" />

  <!-- MAIN EMBLEM (HEART HANDS & SILHOUETTES) -->
  <g transform="translate(0, 10)">
    
    <!-- LEFT BLUE HAND (Outer lobe, thumb & fingers) -->
    <!-- 1. Outer curved arm and upper fingers forming left heart curve -->
    <path d="M 242 278 
             C 215 272, 175 252, 148 218 
             C 125 188, 122 152, 134 128 
             C 146 104, 172 96, 204 104 
             C 230 110, 246 128, 248 135
             C 246 142, 238 136, 222 126
             C 198 112, 168 120, 154 138
             C 142 154, 142 178, 158 202
             C 180 234, 218 252, 245 258
             Z" 
          fill="url(#blueHandGrad)" />

    <!-- 2. Lower thumb & inner cradling palm stroke of left hand -->
    <path d="M 238 280
             C 205 275, 165 248, 142 210
             C 134 196, 128 178, 132 152
             C 134 140, 140 134, 146 142
             C 148 162, 155 182, 172 205
             C 192 230, 222 248, 246 256
             Z" 
          fill="#005bb5" opacity="0.95" />

    <!-- 3. Left Hand Inner Finger / Thumb cupping upwards -->
    <path d="M 158 190
             C 175 215, 206 234, 242 245
             C 246 246, 247 252, 242 254
             C 205 244, 170 222, 152 195
             C 148 188, 154 184, 158 190
             Z" 
          fill="#0077e6" />

    <!-- RIGHT ORANGE HAND (Outer lobe, thumb & fingers) -->
    <!-- 1. Outer curved arm and upper fingers forming right heart curve -->
    <path d="M 242 288
             C 265 284, 305 264, 335 228
             C 362 196, 368 158, 355 130
             C 342 104, 314 96, 282 105
             C 260 112, 248 128, 246 135
             C 248 142, 256 136, 272 126
             C 298 112, 326 122, 338 140
             C 350 156, 348 180, 332 206
             C 308 242, 268 266, 242 278
             Z" 
          fill="url(#orangeHandGrad)" />

    <!-- 2. Lower thumb & inner cradling palm stroke of right hand -->
    <path d="M 244 286
             C 275 278, 320 250, 346 210
             C 356 195, 362 176, 358 152
             C 355 140, 348 134, 342 144
             C 340 164, 332 185, 314 210
             C 290 238, 258 262, 238 276
             Z" 
          fill="#f57c00" opacity="0.95" />

    <!-- 3. Right Hand Inner Finger / Thumb cupping upwards -->
    <path d="M 334 192
             C 314 220, 282 242, 244 254
             C 240 255, 241 261, 246 260
             C 288 248, 322 224, 340 196
             C 344 190, 338 185, 334 192
             Z" 
          fill="#ff9800" />

    <!-- CHILDREN SILHOUETTES IN CENTER (Solid Royal Blue) -->
    <!-- Younger Child on Left -->
    <g fill="#004c99">
      <!-- Child Head with cute profile facing right -->
      <path d="M 208 152
               C 200 152, 186 160, 186 174
               C 186 188, 194 198, 206 198
               C 214 198, 222 192, 224 184
               C 226 178, 230 178, 230 174
               C 230 170, 226 168, 224 168
               C 224 164, 222 160, 218 156
               C 215 153, 211 152, 208 152
               Z" />
      <!-- Child Hair detail wisps -->
      <path d="M 188 168 C 182 164, 184 156, 194 154 C 190 150, 200 148, 206 152 Z" />
      <!-- Child Neck and Torso/Shoulders -->
      <path d="M 204 198
               C 198 204, 190 215, 188 226
               C 196 230, 216 235, 232 235
               C 230 220, 224 205, 218 198
               Z" />
    </g>

    <!-- Older Child / Adolescent on Right -->
    <g fill="#004c99">
      <!-- Adolescent Head with hair texture facing slightly left -->
      <path d="M 276 128
               C 260 128, 248 138, 248 155
               C 248 165, 252 174, 255 178
               C 256 182, 250 186, 252 190
               C 254 194, 260 195, 264 194
               C 268 200, 276 202, 286 200
               C 298 196, 304 184, 304 166
               C 304 148, 292 128, 276 128
               Z" />
      <!-- Adolescent tousled hair texture on top -->
      <path d="M 265 132 C 262 124, 272 122, 278 126 C 284 122, 292 125, 294 132 C 300 134, 304 140, 302 146 C 305 142, 301 135, 295 132 Z" />
      <!-- Adolescent Neck and Shoulders/Chest -->
      <path d="M 268 198
               C 262 208, 250 220, 244 238
               C 255 244, 280 248, 305 242
               C 305 225, 295 208, 284 198
               Z" />
    </g>

  </g> <!-- end emblem group -->

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
    <!-- Line 1: Grupo de Integração Operacional -->
    <text x="250" y="326" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="0.2" 
          fill="#0c4a80">
      Grupo de Integração Operacional
    </text>

    <!-- Line 2: de Direitos da Criança e do Adolescente -->
    <text x="250" y="352" 
          font-size="17" 
          font-weight="700" 
          letter-spacing="0.3" 
          fill="#0c4a80">
      de Direitos da Criança e do Adolescente
    </text>

    <!-- Horizontal Decorative Gradient Line -->
    <path d="M 120 366 Q 250 363 380 366" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Line 3: CURRAIS NOVOS - RN | Grupo TIO -->
    <text x="250" y="388" font-size="14.5" font-weight="800" letter-spacing="0.5">
      <tspan fill="#0c4a80">CURRAIS NOVOS – RN</tspan>
      <tspan fill="#cbd5e1" font-weight="400">  |  </tspan>
      <tspan fill="#f57c00">Grupo TIO</tspan>
    </text>
  </g>

</svg>